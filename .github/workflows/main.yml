name: Lazarus CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest sqlalchemy pandas requests
      - name: Run tests
        run: python -m pytest tests/
